<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AMZ Tools - Wholesale Products Catalog & Analytics</title>
  <link rel="stylesheet" href="./index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    window.addEventListener('error', function(e) {
      console.error('Frontend Error:', e);
      var errEl = document.getElementById('global-error-boundary');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<strong>Application Error:</strong> ' + (e.message || (e.error && e.error.message) || 'Error loading application scripts') + '<br><small>Check the browser console (F12) for more details.</small>';
      }
    });
  </script>
</head>
<body>
  <!-- Global Error Banner -->
  <div id="global-error-boundary" style="display: none; background: #fee2e2; color: #dc2626; padding: 12px 18px; border-bottom: 2px solid #ef4444; font-size: 13px;"></div>

  <!-- App Top Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Welcome / Hero Section -->
  <div id="welcome-container"></div>

  <!-- Main Single-Page Data Table Container -->
  <main class="main-content">
    <!-- Toolbar: Search, Per-Page, Column Settings, Download, Create Button -->
    <div id="toolbar-container"></div>

    <!-- Data Table & Pagination -->
    <div id="table-container">
      <div style="padding: 60px 20px; text-align: center; color: #64748b; font-family: sans-serif;">
        <div class="loading-spinner"></div>
        <p style="margin-top: 10px; font-weight: 500;">Loading AMZ Tools Application...</p>
      </div>
    </div>
  </main>

  <!-- Sticky Footer Section -->
  <div id="footer-container"></div>

  <!-- Global Toast Alerts Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Modular SPA Script -->
  <script type="module" src="./index.js"></script>
</body>
</html>
